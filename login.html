</head>
<body>
    <header>
        <nav>
            <ul class="menuNivel1">
                <li><a class="animacionheader" href="index.html">INICIO</a></li>
                <li><a href="index.html#fecha-conciertos" class="animacionheader">GIRA </a>
                    <ul class="menuNivel2">
                        <li><a href="Gira.html" class="animacionheader">Gira Completa</a></li>
                        <li><a href="Galería.html" class="animacionheader">Galería</a></li>
                        <li><a href="Deportes" class="animacionheader">Entradas</a></li>
                    </ul>
                </li>
                <li><div id="logo"><a href="LuchoRK.html" class="animacionheader"><img src="images/LogoLuchoBlanco.png"></a></div></li>
                <li><a href="Discografía.html" class="animacionheader">DISCOGRAFÍA</a></li>
                <li><a href="login.html" class="login">REGISTRATE</a></li>
            </ul>
        </nav>
    </header>


<main>

<div class="log">

<div class="image">
    <img src="images/SordoDeUnPie.webp" alt="">
    <img class="gradient" src="images/degradado_80_transicion_corta.png" alt="">

</div>


<form>
    <div class="content">
        <h2>
            REGISTRATE
        </h2>

        <div class="rows"> <!--User-->
            <div>
                <input type="text" name="user" placeholder="Nombre de Usuario" id="user" required>
            </div>
            <div class="conocer">
                <p>Donde me descubriste?</p>
                <select name="ask" id="conocer">
                    <option disabled>Selecciona una opción</option>
                    <option value="rcks">Los Rookies</option>
                    <option value="spotify">Spotify</option>
                    <option value="youtube">Youtube</option>
                    <option value="tiktok">Tik Tok</option>
                    <option value="instagram">Instagram</option>
                </select>
            </div>
        </div>
            <div class="rows"> <!--Name & Last Name-->
                        <div>
                <input type="text" name="name" placeholder="Nombre" id="name" required>
            </div>
            <div>
                <input type="text" name="last-name" placeholder="Apellido" id="last-name" required>
            </div>
        </div>
            <div class="rows"> <!--Mail-->
                        <div>
                <input type="text" name="mail" placeholder="Correo" id="mail" required>
            </div>
        </div>
        <div class="rows"> <!--Password-->
                        <div>
                <input type="password" name="password" placeholder="Contraseña" id="password" required>
            </div>
        </div>
        <div class="checkbox"> <!--Accept Terms-->
                <input type="checkbox" name="terms" id="terms" required>
                <label>Aceptas los Terminos y Condiciones de Lucho RK. </label>
        </div>

        <input id="enviar" class="enviar" type="submit" value="ENVIAR">
    </div>





</form>



</div>















</main>

</footer>


</body>
